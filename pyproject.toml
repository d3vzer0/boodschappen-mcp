[project]
name = "boodschappen"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Joey Dreijer", email = "jdreijer@optyx.io" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.6",
    "httpx2>=2.16.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.12.0",
]

[project.scripts]
boodschappen = "boodschappen:main"

[dependency-groups]
dev = ["fastapi>=0.115", "httpx>=0.28.1", "pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
